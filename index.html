Crie um jogode tiro 3D futurista


Aqui está um protótipo completo e funcional de um jogo de tiro 3D em primeira pessoa (FPS) futurista, construído com Three.js diretamente em um único arquivo HTML.

Você pode salvar o código abaixo como jogo.html e abrir em qualquer navegador moderno.

Como jogar:
Clique na tela: Ativa o controle de câmera (trava o cursor/Pointer Lock).
W, A, S, D: Movimentação.
Mouse: Mirar / Olhar em volta.
Clique esquerdo: Disparar projéteis de plasma de energia.
Objetivo: Destruir os drones sentinelas que patrulham a estação espacial.

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CyberStrike 3D - FPS Futurista</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;

    }

      top: 5px; left: 0; width: 12px; height: 2px;

    }

      border: 1px solid #00ffff;

      z-index: 20;

      font-size: 32px;
      letter-spacing: 3px;
    }

      margin: 6px 0;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="hud">
    <div>PONTOS: <span id="scoreDisplay">0</span></div>
    <div>SENTINELAS ATIVAS: <span id="droneDisplay">0</span></div>
  </div>
  <div id="instructions">
    <h1>CYBERSTRIKE 3D</h1>
    <p>Clique aqui para iniciar a simulação</p>
    <p style="font-size: 14px; margin-top: 15px; color: #88ffff;">[W, A, S, D] Mover | [Mouse] Mirar | [Clique] Disparo de Plasma</p>
  </div>

  <script src="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js)"></script>
  <script>
    let scene, camera, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let score = 0;

    const bullets = [];
    const enemies = [];
    const arenaSize = 80;

    const instructions = document.getElementById('instructions');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const droneDisplay = document.getElementById('droneDisplay');

    // Câmera em primeira pessoa (FP controls manuais via Pointer Lock)
    let isLocked = false;
    let pitch = 0, yaw = 0;

    instructions.addEventListener('click', () => {
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === document.body) {
        isLocked = true;
        instructions.style.display = 'none';
      } else {
        isLocked = false;
        instructions.style.display = 'block';
      }
    });

    document.addEventListener('mousemove', (event) => {
      if (!isLocked) return;
      const sensitivity = 0.0022;
      yaw -= event.movementX * sensitivity;
      pitch -= event.movementY * sensitivity;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
    });

    // Teclas
    document.addEventListener('keydown', (e) => {
      switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
      }
    });

    document.addEventListener('mousedown', (e) => {
      if (isLocked && e.button === 0) {
        shootPlasma();
      }
    });

    init();
    animate();

    function init() {
      // Cena e Névoa Futurista
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050714);
      scene.fog = new THREE.FogExp2(0x050714, 0.02);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.8, 0);

      // Iluminação Sci-Fi
      const ambientLight = new THREE.AmbientLight(0x223344, 1.5);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00ffff, 1.2);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      // Chão em Grid Néon
      const floorGrid = new THREE.GridHelper(arenaSize, 40, 0x00ffff, 0x113344);
      floorGrid.position.y = 0;
      scene.add(floorGrid);

      const floorGeo = new THREE.PlaneGeometry(arenaSize, arenaSize);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x080c18, roughness: 0.6, metalness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Paredes perimetrais futuristas
      createPillars();

      // Renderizador
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      window.addEventListener('resize', onWindowResize);

      // Criar inimigos iniciais
      for (let i = 0; i < 6; i++) {
        spawnEnemy();
      }
    }

    function createPillars() {
      const geo = new THREE.BoxGeometry(2, 8, 2);
      const mat = new THREE.MeshStandardMaterial({ color: 0x1a223a, emissive: 0x003344 });
      for (let i = -arenaSize / 2 + 5; i < arenaSize / 2; i += 12) {
        for (let j = -arenaSize / 2 + 5; j < arenaSize / 2; j += 12) {
          if (Math.abs(i) < 6 && Math.abs(j) < 6) continue;
          const pillar = new THREE.Mesh(geo, mat);
          pillar.position.set(i, 4, j);
          scene.add(pillar);
        }
      }
    }

    function shootPlasma() {
      const geo = new THREE.SphereGeometry(0.12, 8, 8);
      const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const bullet = new THREE.Mesh(geo, mat);

      // Pega direção atual da mira
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);

      bullet.position.copy(camera.position).addScaledVector(dir, 0.5);
      bullet.userData = {
        direction: dir.clone(),
        speed: 55,
        life: 1.5
      };

      scene.add(bullet);
      bullets.push(bullet);
    }

    function spawnEnemy() {
      const group = new THREE.Group();
      
      // Núcleo do drone
      const coreGeo = new THREE.OctahedronGeometry(0.8);
      const coreMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x880022, roughness: 0.3 });
      const core = new THREE.Mesh(coreGeo, coreMat);
      group.add(core);

      // Anel orbital
      const ringGeo = new THREE.TorusGeometry(1.2, 0.05, 8, 24);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xff3377 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      group.add(ring);

      const x = (Math.random() - 0.5) * (arenaSize - 15);
      const z = (Math.random() - 0.5) * (arenaSize - 15);
      group.position.set(x, 1.8 + Math.random() * 1.5, z);

      group.userData = {
        speed: 2 + Math.random() * 2,
        ring: ring
      };

      scene.add(group);
      enemies.push(group);
      droneDisplay.textContent = enemies.length;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      if (isLocked) {
        // Rotação da câmera
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        euler.x = pitch;
        euler.y = yaw;
        camera.quaternion.setFromEuler(euler);

        // Movimentação do Jogador
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        const moveSpeed = 40.0;
        if (moveForward || moveBackward) velocity.z -= direction.z * moveSpeed * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * moveSpeed * delta;

        // Projeta movimento relativo à rotação horizontal (yaw)
        const forwardVector = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const rightVector = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        camera.position.addScaledVector(forwardVector, -velocity.z * delta);
        camera.position.addScaledVector(rightVector, -velocity.x * delta);

        // Limites da Arena
        const limit = arenaSize / 2 - 2;
        camera.position.x = Math.max(-limit, Math.min(limit, camera.position.x));
        camera.position.z = Math.max(-limit, Math.min(limit, camera.position.z));
      }

      // Atualizar Balas
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.addScaledVector(b.userData.direction, b.userData.speed * delta);
        b.userData.life -= delta;

        // Colisão com inimigos
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          if (b.position.distanceTo(enemy.position) < 1.3) {
            scene.remove(enemy);
            enemies.splice(j, 1);
            scene.remove(b);
            bullets.splice(i, 1);

            score += 100;
            scoreDisplay.textContent = score;
            spawnEnemy();
            break;
          }
        }

        // Remover projétil expirado
        if (b && b.userData.life <= 0) {
          scene.remove(b);
          bullets.splice(i, 1);
        }
      }

      // Atualizar Inimigos (IA Básica de perseguição/flutuação)
      for (const enemy of enemies) {
        enemy.userData.ring.rotation.x += 0.03;
        enemy.userData.ring.rotation.y += 0.02;

        const toPlayer = new THREE.Vector3().subVectors(camera.position, enemy.position);
        toPlayer.y = 0;
        toPlayer.normalize();
        enemy.position.addScaledVector(toPlayer, enemy.userData.speed * delta);
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
